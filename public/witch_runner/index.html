<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storm Witch — Grip Therapy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: MicroStyle;
        src: url('assets/fonts/MicroStyle.ttf') format('truetype');
      }
      @font-face {
        font-family: Serpentine;
        src: url('assets/fonts/Serpentine.ttf') format('truetype');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* ── Serial monitor (raw controller lines) ───────────────────────── */
      #serial-monitor {
        position: fixed;
        bottom: 10px;
        left: 10px;
        width: min(440px, 46vw);
        max-height: min(220px, 30vh);
        z-index: 380;
        display: none;
        flex-direction: column;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        background: rgba(14, 18, 32, 0.92);
        color: #9fd8ff;
        border: 1px solid rgba(91, 181, 207, 0.45);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        pointer-events: auto;
      }
      #serial-monitor.visible { display: flex; }
      #serial-monitor .sm-head {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        background: rgba(22, 33, 62, 0.98);
        color: #5bb5cf;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #serial-monitor .sm-head button {
        font: inherit;
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid rgba(173, 216, 230, 0.35);
        background: rgba(173, 216, 230, 0.12);
        color: #e8f4fc;
        cursor: pointer;
      }
      #serial-monitor .sm-head button:hover { background: rgba(173, 216, 230, 0.22); }
      #serial-monitor .sm-body {
        flex: 1;
        overflow: auto;
        padding: 8px 10px;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #serial-monitor .sm-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

      /* Connection screen overlay */
      #connect-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
      }
      .connect-card {
        background: rgba(20, 18, 15, 0.92);
        border: 2px solid #c2e1a5;
        border-radius: 24px;
        padding: 48px 56px;
        text-align: center;
        max-width: 440px;
        width: 90%;
      }
      .connect-card h1 {
        font-family: 'Serpentine', 'Outfit', sans-serif;
        font-size: 48px;
        color: #fff;
        margin-bottom: 4px;
        letter-spacing: 2px;
      }
      .connect-card .subtitle {
        font-size: 18px;
        color: #c2e1a5;
        margin-bottom: 36px;
        font-weight: 600;
      }
      .connect-card button {
        display: block;
        width: 100%;
        padding: 14px 20px;
        margin-bottom: 14px;
        border: 2px solid #c2e1a5;
        border-radius: 14px;
        background: transparent;
        color: #c2e1a5;
        font-family: 'Outfit', sans-serif;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, color 0.2s, transform 0.1s;
      }
      .connect-card button:hover {
        background: #c2e1a5;
        color: #6B5344;
      }
      .connect-card button:active {
        transform: scale(0.97);
      }
      .connect-card button:last-of-type {
        margin-bottom: 0;
      }
      .connect-card button:focus-visible {
        outline: 3px solid #c2e1a5;
        outline-offset: 3px;
      }
      .connect-card .patient-label {
        margin-top: 28px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.5);
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- Serial monitor (shown when connected) -->
    <div id="serial-monitor" aria-label="Serial debug output">
      <div class="sm-head">
        <span>Serial (temp)</span>
        <div class="sm-actions">
          <button type="button" id="serial-monitor-pause">Pause</button>
          <button type="button" id="serial-monitor-toggle">Hide</button>
          <button type="button" id="serial-monitor-clear">Clear</button>
        </div>
      </div>
      <pre class="sm-body" id="serial-monitor-log"></pre>
    </div>

    <div id="connect-screen" role="dialog" aria-modal="true" aria-labelledby="sw-connect-title">
      <div class="connect-card">
        <h1 id="sw-connect-title">Storm Witch</h1>
        <div class="subtitle">Grip Therapy Edition</div>
        <button id="btn-ble">Connect via BLE</button>
        <button id="btn-usb">Connect via USB</button>
        <button id="btn-space">Play with Space Bar</button>
        <div class="patient-label" id="patient-id">Patient: —</div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
